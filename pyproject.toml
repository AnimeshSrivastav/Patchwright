[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchwright"
version = "0.1.0"
description = "Autonomous incident-fixing agent"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.10.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "langfuse>=3.0.0",
    "opentelemetry-sdk>=1.42.0",
    "opentelemetry-exporter-otlp>=1.42.0",
    "deepeval>=1.0.0",
    "scikit-learn>=1.5.0",
    "PyGithub>=2.3.0",
    "GitPython>=3.1.0",
    "docker>=7.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
patchwright = "autofix.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["patchwright", "autofix", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
strict = true
